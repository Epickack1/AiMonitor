<div class="card model-card mb-4">
    <div class="card-body">
        <h1 class="card-title h3">{{ model.name }}</h1>
        <p class="card-text">
            <strong>ID:</strong> <code>{{ model.id }}</code>
            <button class="copy-id" type="button" data-model-id="{{ model.id }}" title="Скопировать id">⧉</button>
        </p>
        <p class="card-text"><strong>Тип:</strong> {{ model.is_free|yesno:"бесплатная,платная" }}</p>
        <p class="card-text">
            <strong>Статус сейчас:</strong>
            {% include "includes/status_badge.html" with status=result.status %}
            аптайм {% include "includes/uptime.html" with value=result.uptime %}
        </p>
    </div>
</div>
