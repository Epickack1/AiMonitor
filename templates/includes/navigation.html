{% load static %}
{% with section=request.resolver_match.namespace %}
<nav class="navbar navbar-expand bg-dark navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'homepage:index' %}">
            <img
                src="{% static 'homepage/img/logo.svg' %}"
                alt="Логотип {{ site_name }}"
                class="aimonitor-logo"
            >
            {{ site_name }}
        </a>
        <div class="navbar-nav">
            <a
                class="nav-link{% if section == 'watchlist' %} active{% endif %}"
                href="{% url 'watchlist:list' %}"
            >Модели{% if tracked_models_count is not None %} <span class="badge bg-secondary">{{ tracked_models_count }}</span>{% endif %}</a>
            <a
                class="nav-link{% if request.resolver_match.view_name == 'checks:history' %} active{% endif %}"
                href="{% url 'checks:history' %}"
            >История проверок</a>
            <a
                class="nav-link{% if request.resolver_match.view_name == 'checks:stats' %} active{% endif %}"
                href="{% url 'checks:stats' %}"
            >Статистика</a>
        </div>
    </div>
</nav>
{% endwith %}
