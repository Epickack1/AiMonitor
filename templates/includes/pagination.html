<nav aria-label="Страницы">
    <ul class="pagination">
        {% if page.has_previous %}
            <li class="page-item"><a class="page-link" href="{% querystring page=1 %}">« первая</a></li>
            <li class="page-item"><a class="page-link" href="{% querystring page=page.previous_page_number %}">‹ назад</a></li>
        {% endif %}
        {% for number in page.paginator.page_range %}
            <li class="page-item{% if number == page.number %} active{% endif %}">
                <a class="page-link" href="{% querystring page=number %}">{{ number }}</a>
            </li>
        {% endfor %}
        {% if page.has_next %}
            <li class="page-item"><a class="page-link" href="{% querystring page=page.next_page_number %}">вперёд ›</a></li>
            <li class="page-item"><a class="page-link" href="{% querystring page=page.paginator.num_pages %}">последняя »</a></li>
        {% endif %}
    </ul>
</nav>
