<div class="col">
    <div class="card stat-card {{ border }} h-100">
        <div class="card-body">
            <p class="stat-label mb-1">{{ label }}</p>
            <p class="card-text h5 mb-1">{{ item.model.name }}</p>
            <p class="card-text text-muted mb-0">
                доступна в {{ item.percent|floatformat:0 }}% проверок
            </p>
        </div>
    </div>
</div>
